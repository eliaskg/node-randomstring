name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # Node 20 reached end of life on 2026-04-30.
        # Node 22 is in maintenance until 2027-04-30.
        # Node 24 is active LTS. Node 26 becomes LTS on 2026-10-28.
        node-version: [22, 24, 26]
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}

      # The repository tracks no lockfile. package-lock.json is in .gitignore.
      # npm ci needs a lockfile, so use npm install.
      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run tests
        run: npm test